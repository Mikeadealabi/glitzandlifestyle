services:
  db:
    image: postgres:16-alpine
    container_name: glitz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitz
      POSTGRES_PASSWORD: glitz
      POSTGRES_DB: glitz
    ports:
      - "5436:5432"
    volumes:
      - glitz-data:/var/lib/postgresql/data
volumes:
  glitz-data:
